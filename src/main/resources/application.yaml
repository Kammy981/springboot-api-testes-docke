spring:
  application:
    name: produtos
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/produtos}
    username: ${DB_USER}
    password: ${DB_PASSWORD}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: update

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never
